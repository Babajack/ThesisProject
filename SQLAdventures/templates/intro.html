{% extends 'base.html' %}
{% block title %}- Home {% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/intro.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='scripts/intro.js') }}"></script>
    <script type="text/javascript"> loadIntro({{ g.user['username']|tojson }}) </script>
{% endblock %}

{% block body %}
    <!-- Page Content -->
    <div id="main-container" class="container-fluid">
        <div class="row mb-5">
            <div class="col-12 text-center">
                <h1 class="mt-5" style="color: white">Willkommen bei SQL Adventures!</h1>
            </div>
        </div>
        <div id="main-row" class="row justify-content-center align-items-end">


                <div class="col-lg-4 col-sm-8 col-12 text-center">
                    <div id="bubble" class="speech-bubble p-2 mb-3 mx-5">
                        text
                    </div>
                    <img id="image" class="img-fluid"
                         src="{{ url_for('static', filename='/images/Bauer.png') }}"
                         alt="">
                </div>
                <div class="col-lg-2 col-4 mb-3">
                    <button id="ContinueButton" name="ContinueButton" type="submit"
                            class="btn"
                            style="font-size: 30px; font-weight: bold; background-color: #343a40; color: white">
                        Weiter
                    </button>
                </div>


        </div>
    </div>

{% endblock %}

{% block home_active %}active{% endblock %}
