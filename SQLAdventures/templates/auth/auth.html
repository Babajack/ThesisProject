<!doctype html>
<html lang="de">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- remove in production -->
    <link rel="shortcut icon" href="#">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/auth.css') }}">

    <title> SQL Adventures {% block title %} <!-- set the title for children --> {% endblock %} </title>
</head>
<body style="background-color: gray">

<!-- replace Navigation if needed -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark static-top">
    <div class="container">
        <span class="navbar-brand"> SQL Adventures </span>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item {% block login_active %}{% endblock %}">
                    <a class="nav-link" href=" {{ url_for('auth.login') }} ">Login</a>
                </li>
                <li class="nav-item {% block register_active %}{% endblock %}">
                    <a class="nav-link" href="{{ url_for('auth.register') }}">Registrieren</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="height: calc(100vh - 56px);">
    <div class="row align-items-center h-100">
        <div class="jumbotron col-4">
            {% block form %} {% endblock %}
        </div>
        <div class="col-1"></div>
        <div class="col-7">
            <div class="row jumbotron">
                <div class="col-12 mb-4">
                    <h3>Was ist SQL Adventures?</h3>
                </div>
                <div class="col-12 mb-4">
                    <span style="font-size: large;"> SQL Adventures ist ein Text-basiertes SQL Lern- und Übungsspiel.
                    Löse verschiedene Rätsel und helfe den Bewohnern des Landes, um den Bösewicht zu besiegen! </span>
                </div>
                <div class="col-6">
                    <img class="float-right" src="{% block image_url %}{% endblock %}" alt="">
                </div>
                <div class="col-6">
                    <div class="speech-bubble p-2 mb-3 float-left">
                        {% block bubble_text %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
