{% extends 'base.html' %}
{% block title %}- Login {% endblock %}

{% block body %}
    <div class="container vh-100">
        <div class="row align-items-center vh-100">
            <div class="jumbotron col-md-4">
                <form method="post">
                    <h2 class="pb-4"> Jetzt Spielen! </h2>
                    <div class="form-group">
                        <label for="username" class="sr-only">Username</label>
                        <input type="text" class="form-control" name="username" id="username" placeholder="Benutzername"
                               required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Passwort"
                               required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    {% if error %}
                        <p class="jumbotron-fluid mt-2 bg-warning"><strong> {{ error }} </strong></p>
                    {% endif %}

                    <p class="mt-3"> Was ist SQL Adventures? <a href="#"> Hier klicken</a></p>
                    <p class="mt-1"> Noch nicht angemeldet? <a href="{{ url_for('auth.register') }}"> Neuen Account
                        erstellen</a></p>
                </form>
            </div>
            <div class="col-md-8">
                <!-- add some picture or smth -->
            </div>
        </div>
    </div>
{% endblock %}
